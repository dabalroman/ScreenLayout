; Example layouts.ini (one PC with a 34" ultrawide, a 22" side monitor and a projector).
; Copy it to layouts.ini, or run "ScreenLayout.exe init" to generate one for the monitors you have.
;
; [monitors]: Short Monitor ID = display name; the toast draws them left to right in this order.
; Mode sections: name, hotkey (shown in the toast), then one line per monitor that is on:
;   <Short Monitor ID> = <width>x<height>@<Hz> <x>,<y> [primary]
; A monitor that is not listed in a mode is turned off. If a listed monitor isn't connected,
; the rest of the layout is still applied.

[monitors]
DELA0D9 = Dell P2217H
IVM7628 = iiyama PL3466WQ
AML0030 = Wanbo T6 Max

[both]
name = Both (D1+D2)
hotkey = Ctrl+Alt+1
IVM7628 = 3440x1440@144 0,0 primary
DELA0D9 = 1920x1080@60 -1920,0

[d1]
name = D1 only
hotkey = Ctrl+Alt+2
IVM7628 = 3440x1440@144 0,0 primary

[d2]
name = D2 only
hotkey = Ctrl+Alt+3
DELA0D9 = 1920x1080@60 0,0 primary

[projector]
name = Projector only
hotkey = Ctrl+Alt+4
AML0030 = 1920x1080@60 0,0 primary
